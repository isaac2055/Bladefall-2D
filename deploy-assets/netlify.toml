# Static asset copy only. Deploy from the repository root to include the
# score/feedback function; see docs/playtest/RELEASE-7.300.md in the repository.
[build]
  publish = "."

# The service worker must never be cached, or players get stuck on an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Serve the web app manifest with the correct type (some hosts default to
# application/octet-stream, which stops "Add to Home Screen" from working).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
