<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bladefall Dialogue Editor</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121620;--ink:#ece8dd;--muted:#929aaa;--gold:#d8b56d;--line:#303746}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#253043 0,#090b10 52%);color:var(--ink);font:15px/1.45 system-ui,sans-serif}main{width:min(1040px,92vw);margin:42px auto 80px}h1{margin:0;font:900 36px Georgia,serif;letter-spacing:.04em}p{color:var(--muted)}.topline{display:flex;align-items:center;justify-content:space-between;gap:18px}.game-link{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:2;padding:14px 0;background:linear-gradient(#0b0e14 75%,transparent)}input,select,textarea,button{font:inherit;color:inherit;background:#0d1119;border:1px solid var(--line);border-radius:8px}input{flex:1;min-width:220px;padding:10px 12px}select,button{padding:10px 14px}button{cursor:pointer;font-weight:800}button.primary{background:#5a4523;border-color:#b88d48}.entry{margin:12px 0;padding:16px;background:rgba(18,22,32,.94);border:1px solid var(--line);border-radius:12px}.meta{display:flex;gap:9px;align-items:center;margin-bottom:9px}.id{color:var(--gold);font-weight:900}.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#282e3a;color:#b7c0cf}.speaker{margin-left:auto;color:#cfd5df}textarea{width:100%;min-height:90px;padding:11px 12px;resize:vertical}.changed{border-color:#b88d48;box-shadow:0 0 0 1px #b88d48 inset}#status{min-height:20px;color:#a7d9b4;font-weight:700}.note{padding:12px;border-left:3px solid var(--gold);background:rgba(216,181,109,.07)}
</style></head><body><main>
<div class="topline"><h1>Bladefall Dialogue Editor</h1><a class="game-link" href="./index.html">Return to Bladefall</a></div>
<p class="note">All currently authored Levels 1–3 NPC, sign, item, and story text lives here. Changes save separately from campaign data, so Full Reset does not erase them. Reload the game after saving.</p>
<div class="toolbar"><input id="search" placeholder="Search speaker, ID, or text"><select id="level"><option value="all">All three levels</option><option value="0">Level 1</option><option value="1">Level 2</option><option value="2">Level 3</option></select><button class="primary" id="save">Save changes</button><button id="saveReturn">Save &amp; return</button><button id="export">Export JSON</button><button id="import">Import JSON</button><button id="reset">Restore defaults</button></div>
<div id="status" role="status"></div><section id="entries"></section><input id="file" type="file" accept="application/json" hidden>
</main><script src="bladefall-dialogue.js"></script><script>
'use strict';
const api=window.BladefallDialogue,overrides=api.load(),root=document.getElementById('entries'),search=document.getElementById('search'),level=document.getElementById('level'),status=document.getElementById('status');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const q=search.value.trim().toLowerCase(),lv=level.value;root.innerHTML=api.catalog().filter(row=>(lv==='all'||String(row.level)===lv)&&(!q||[row.id,row.speaker,row.type,overrides[row.id]||row.text].join(' ').toLowerCase().includes(q))).map(row=>`<article class="entry"><div class="meta"><span class="id">${esc(row.id)}</span><span class="tag">LEVEL ${row.level+1}</span><span class="tag">${esc(row.type)}</span><span class="speaker">${esc(row.speaker)}</span></div><textarea data-id="${esc(row.id)}" class="${overrides[row.id]!==undefined?'changed':''}">${esc(overrides[row.id]!==undefined?overrides[row.id]:row.text)}</textarea></article>`).join('');}
function collect(){document.querySelectorAll('textarea[data-id]').forEach(node=>{const base=api.ENTRIES[node.dataset.id].text,value=node.value.trim();if(value&&value!==base)overrides[node.dataset.id]=value;else delete overrides[node.dataset.id];});}
function save(){collect();api.save(overrides);status.textContent='Saved. Reload Bladefall to use the new copy.';render();}
// Preserve an in-progress rewrite when the author searches or changes level;
// filtering must never silently discard text that has not yet been saved.
root.addEventListener('input',e=>{if(!e.target.matches('textarea[data-id]'))return;collect();e.target.classList.toggle('changed',overrides[e.target.dataset.id]!==undefined);status.textContent='Unsaved changes.';});
search.oninput=()=>{collect();render();};level.onchange=()=>{collect();render();};
document.getElementById('save').onclick=save;
document.getElementById('saveReturn').onclick=()=>{collect();api.save(overrides);location.href='./index.html';};
document.getElementById('export').onclick=()=>{collect();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(overrides,null,2)],{type:'application/json'}));a.download='bladefall-dialogue-overrides.json';a.click();URL.revokeObjectURL(a.href);};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{Object.assign(overrides,api.safeOverrides(JSON.parse(await e.target.files[0].text())));api.save(overrides);status.textContent='Imported and saved.';render();}catch(_){status.textContent='That file is not valid Bladefall dialogue JSON.';}};
document.getElementById('reset').onclick=()=>{if(!confirm('Restore every Level 1–3 entry to its default wording?'))return;for(const key of Object.keys(overrides))delete overrides[key];api.save(overrides);status.textContent='Defaults restored.';render();};render();
</script></body></html>
