 #pcCanvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
 /* Touch (7.258): bigger targets, menus that swipe, and a nudge to turn the phone sideways. */

 html.pcTouch .pcCard{padding:14px 14px}
 html.pcTouch .pcBtn{padding:13px 12px;font-size:15px}
 html.pcTouch .pcChoice{padding:12px;min-height:64px}
 html.pcTouch .pcMini{min-width:44px;min-height:40px}
 html.pcTouch .pcOpt select{font-size:15px;padding:6px 4px;max-width:100%}
 .pcTouchRow{justify-content:space-between;flex-wrap:wrap}.pcTouchRow>span{flex:1 1 150px}
 .pcTabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.pcTabs::-webkit-scrollbar{display:none}
 .pcTab{flex:0 0 auto;min-width:44px;padding:9px 10px;background:#1f2430;color:#dcd3bf;border:1px solid #3a4150;font:inherit;font-size:14px}
 .pcTab.on{border-color:#c9a86a;color:#f0d9a8;background:#2a2f3c}
 .pcPages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin-bottom:10px}
 .pcPages::-webkit-scrollbar{display:none}
 .pcPage{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;box-sizing:border-box;padding:0 2px;max-height:calc(100vh - 175px);min-height:160px;overflow-y:auto;overscroll-behavior-y:contain}
 html.pcTouch .pcCard.wide>h1{font-size:18px;margin-bottom:4px}html.pcTouch .pcCard.wide>.pcSub{display:none}
 .pcPage .pcPart{margin-top:2px}
 #pcRotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;background:#07080bf2;color:#e9dcc0;font-size:16px;padding:24px;z-index:5}
 @media (orientation:portrait){html.pcTouch.pcPlaying #pcRotate{display:flex}}
 #pcOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#07080bcc;padding:16px;box-sizing:border-box;overflow:auto}
 #pcOverlay.show{display:flex}
 .pcCard{margin:auto;background:#12151c;border:1px solid #3a3f4c;box-shadow:0 0 0 1px #000,0 12px 40px #000a;padding:20px 22px;max-width:520px;width:100%;box-sizing:border-box}
 .pcCard.wide{max-width:980px}
 .pcCard h1{margin:0 0 6px;font-size:22px;letter-spacing:.06em;color:#f0d9a8;font-weight:600}
 .pcSub{color:#aab0bd;font-size:13px;line-height:1.5;margin:6px 0 14px}
 .pcGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:8px;margin-bottom:14px}
 .pcPart{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c9a86a;margin:14px 0 8px;font-weight:600}
 .pcChoice{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto auto;text-align:left;background:#1a1e27;border:1px solid #333948;color:inherit;padding:10px 12px;cursor:pointer;font:inherit;gap:2px 8px}
 .pcChoice:hover,body.pcNav .pcChoice:focus{border-color:#c9a86a;background:#20242e;outline:none}
 .pcChoice[data-bank-room]{grid-template-columns:38px 1fr}
 .pcNum{grid-row:1/4;font-size:20px;color:#c9a86a;align-self:center}
 .pcName{font-size:15px;color:#f0e2c2}.pcName em{color:#8fe0a0;font-style:normal}
 .pcDesc{font-size:12px;color:#a9afbb;line-height:1.4}.pcMeta{font-size:11px;color:#7d8494}
 .pcRow{display:flex;flex-wrap:wrap;gap:8px}
 .pcBtn{display:block;width:100%;margin:6px 0;padding:10px 12px;background:#c9a86a;color:#1a1408;border:0;font:inherit;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box}
 .pcRow .pcBtn{width:auto;flex:1 1 180px}
 .pcBtn.ghost{background:#1f2430;color:#dcd3bf;border:1px solid #3a4150}
 .pcBtn:hover{filter:brightness(1.1)}
 .pcTable{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px}.pcTable td{padding:5px 4px;border-bottom:1px solid #2a2f3a}.pcTable td:first-child{color:#aab0bd}
 .pcOpt{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
 .pcOpt select{background:#1f2430;color:#e9dcc0;border:1px solid #3a4150;font:inherit}
 .pcMiniRow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
 .pcMini{min-width:38px;padding:6px;background:#1f2430;color:#dcd3bf;border:1px solid #3a4150;font:inherit;cursor:pointer}
 .pcMini.on{border-color:#c9a86a;color:#f0d9a8}
 .pcCard.mid{max-width:760px}
 body.pcNav #pcOverlay :focus{outline:2px solid #f0d9a8;outline-offset:2px}
 .pcBinds th{text-align:left;color:#c9a86a;font-weight:600;padding:5px 4px;border-bottom:1px solid #3a3f4c;font-size:12px;letter-spacing:.05em}
 .pcBinds td{vertical-align:middle}
 .pcChips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
 .pcChip{background:#252a36;color:#f0e2c2;border:1px solid #454c5c;font:inherit;font-size:12px;padding:3px 7px;cursor:pointer}
 .pcChip:hover{border-color:#c96a6a}.pcChip span{color:#8a7f70}
 .pcAdd{background:none;color:#c9a86a;border:1px dashed #5a513e;font:inherit;font-size:12px;padding:3px 7px;cursor:pointer}
 .pcAdd.on{border-style:solid;border-color:#f0d9a8;color:#f0d9a8;animation:pcBlink 1s steps(2) infinite}
 @keyframes pcBlink{50%{opacity:.55}}
