<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bladefall · Sealed Recollection</title>
<style>
  :root{color-scheme:dark;--ink:#f2eadc;--muted:#aaa0b3;--glass:#100c16ee;--line:#5b476d;--violet:#c6a5e8}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
  #archiveFrame{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:#050407}
  #archiveFrame.ready{visibility:visible}
  #bar{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);padding:8px 9px 8px 16px;border:1px solid #765c8b88;border-radius:999px;background:var(--glass);box-shadow:0 8px 32px #000a;backdrop-filter:blur(8px)}
  #title{font-size:11px;font-weight:900;letter-spacing:.17em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--violet)}
  #exit{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#21182b;color:var(--ink);font-weight:800;cursor:pointer}
  #veil{position:fixed;z-index:3;inset:0;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 42%,#281a3488,#050407 55%)}
  #veil.hide{display:none}.card{max-width:570px;text-align:center;padding:26px;border:1px solid var(--line);border-radius:18px;background:#0c0910e8;box-shadow:0 22px 70px #000}
  h1{margin:0 0 8px;color:var(--violet);font-size:clamp(25px,5vw,42px)}p{color:var(--muted);line-height:1.55;margin:8px 0}.error{color:#e98e91}
</style>
</head>
<body>
<iframe id="archiveFrame" title="Playable Sealed Recollection"></iframe>
<div id="bar" hidden><span id="title">SEALED RECOLLECTION</span><button id="exit" type="button">Return to the dream</button></div>
<div id="veil"><div class="card"><h1 id="veilTitle">Opening black glass…</h1><p id="veilText">This recovered road is isolated from the living campaign. Nothing found or lost here changes the knight’s save.</p></div></div>
<script>
(() => {
  'use strict';
  const ZONES=['outskirts','black-woods','brute','updrafts','hollow-marksman','ruined-keep','warden','frostfell','frost-sorcerer','emberdeep','ember-colossus','inversion','void-tyrant','abyss-king','gilded-vault','deep-line'];
  const TITLES=['The Road Before','The Lying Wood','The Broken Standard','The Needlewind','The Deadeye','The First Keep','The Gaoler','The White Expanse','The Cold Hand','The Buried Forge','The Furnace General','The Upside-Down Road','The Hollow Crown','The Last Enemy','The Golden Lie','The Line Beneath'];
  const params=new URLSearchParams(location.search),stage=Math.max(0,Math.min(15,Number.parseInt(params.get('stage')||'-1',10)));
  const veil=document.getElementById('veil'),veilTitle=document.getElementById('veilTitle'),veilText=document.getElementById('veilText'),frame=document.getElementById('archiveFrame'),bar=document.getElementById('bar');
  const fail=(message)=>{veilTitle.textContent='The glass stays dark';veilText.textContent=message;veilText.className='error';};
  document.getElementById('exit').onclick=()=>location.replace('./index.html');
  let save={};try{save=JSON.parse(localStorage.getItem('bladefall_v2')||'{}')||{};}catch(_error){}
  const archive=save.recollections&&typeof save.recollections==='object'?save.recollections:{};
  const authorized=archive.keyFound===true&&Array.isArray(archive.found)&&archive.found.includes(ZONES[stage]);
  if(!authorized){fail('This Recollection is either undiscovered or still waiting for the Waking Key.');return;}
  document.getElementById('title').textContent='SEALED RECOLLECTION · '+TITLES[stage].toUpperCase();
  fetch('./index.html.pre-multiplayer.bak',{cache:'no-store'}).then(response=>{
    if(!response.ok)throw new Error('archive asset missing');return response.text();
  }).then(raw=>{
    const close='</scr'+'ipt>';
    const memoryPrelude=`<script>(()=>{const rows=new Map();const vault={getItem:k=>rows.has(String(k))?rows.get(String(k)):null,setItem:(k,v)=>rows.set(String(k),String(v)),removeItem:k=>rows.delete(String(k)),clear:()=>rows.clear(),key:i=>[...rows.keys()][i]||null,get length(){return rows.size}};Object.defineProperty(window,'localStorage',{value:vault,configurable:false});window.__BLADEFALL_RECOLLECTION__=true;})()${close}<base href="./"><style>canvas{filter:saturate(.72) brightness(.79) contrast(1.18) hue-rotate(7deg)}#overlay{background:rgba(3,2,6,.9)!important}</style>`;
    let html=raw.replace('<head>','<head>'+memoryPrelude);
    html=html.replace(/\/\* PWA: offline play[\s\S]*?navigator\.serviceWorker\.register\('\.\/sw\.js'\)\.catch\(\(\)=>\{\}\);\}\);\n\}/,'/* Recollection runtime: service-worker registration intentionally removed. */');
    const boot=`<script>window.addEventListener('load',()=>{setTimeout(()=>{try{beginRun(0,null,{hp:1.35,dmg:1.20},{startStage:${stage},intro:false,levelSelect:true});if(G){G.leaderboardEligible=false;G.recollectionMode=true;}parent.postMessage({type:'bladefall-recollection-ready',stage:${stage}},'*');}catch(error){parent.postMessage({type:'bladefall-recollection-error',message:String(error&&error.message||error)},'*');}},80);});${close}`;
    html=html.replace('</body>',boot+'</body>');frame.srcdoc=html;
  }).catch(error=>fail('The recovered road could not be opened: '+error.message));
  addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==frame.contentWindow||!event.data)return;
    if(event.data.type==='bladefall-recollection-ready'){frame.classList.add('ready');bar.hidden=false;veil.classList.add('hide');}
    if(event.data.type==='bladefall-recollection-error')fail('The recovered road could not begin: '+event.data.message);
  });
})();
</script>
</body>
</html>
